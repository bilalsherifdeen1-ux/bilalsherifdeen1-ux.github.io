<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generate OG Preview</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #111;
      color: #eee;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    main { width: min(1200px, 94vw); padding: 28px 0 40px; text-align: center; }
    h1 { margin: 0 0 8px; font-size: 1.1rem; font-weight: 650; }
    p { margin: 0 0 20px; color: #9aa8a7; font-size: .92rem; }
    canvas { width: 100%; height: auto; display: block; border: 1px solid #333; border-radius: 12px; }
    button {
      margin-top: 18px; padding: 11px 18px; border: 1px solid #68f4cd; border-radius: 8px;
      background: #68f4cd; color: #071315; font: 700 .9rem ui-monospace, SFMono-Regular, Menlo, monospace; cursor: pointer;
    }
    button:hover { background: #9affdf; }
    #status { min-height: 1.2em; margin-top: 10px; color: #68f4cd; font: .78rem ui-monospace, SFMono-Regular, Menlo, monospace; }
  </style>
</head>
<body>
  <main>
    <h1>Social Preview Generator</h1>
    <p>Rendered at 1200 × 630. The PNG download starts automatically when the portrait loads.</p>
    <canvas id="og" width="1200" height="630" aria-label="Open Graph social preview"></canvas>
    <button id="download" type="button">Download og-preview.png</button>
    <div id="status" role="status"></div>
  </main>

  <script>
    const canvas = document.getElementById('og');
    const ctx = canvas.getContext('2d');
    const status = document.getElementById('status');
    const download = document.getElementById('download');
    let ready = false;

    function roundedRect(x, y, w, h, r) {
      ctx.beginPath();
      ctx.roundRect(x, y, w, h, r);
    }

    function drawPill(text, x, y) {
      ctx.font = '600 15px ui-monospace, SFMono-Regular, Menlo, monospace';
      const width = ctx.measureText(text).width + 32;
      ctx.fillStyle = 'rgba(104,244,205,0.08)';
      ctx.strokeStyle = 'rgba(104,244,205,0.3)';
      ctx.lineWidth = 1.5;
      roundedRect(x, y, width, 40, 8);
      ctx.fill();
      ctx.stroke();
      ctx.fillStyle = '#68f4cd';
      ctx.fillText(text, x + 16, y + 26);
      return width;
    }

    function render() {
      ctx.fillStyle = '#071315';
      ctx.fillRect(0, 0, 1200, 630);

      ctx.strokeStyle = 'rgba(104,244,205,0.05)';
      ctx.lineWidth = 1;
      for (let x = 0; x < 1200; x += 60) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 630); ctx.stroke(); }
      for (let y = 0; y < 630; y += 60) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(1200, y); ctx.stroke(); }

      const radial = ctx.createRadialGradient(980, 200, 10, 980, 200, 450);
      radial.addColorStop(0, 'rgba(85,217,239,0.18)');
      radial.addColorStop(1, 'rgba(7,19,21,0)');
      ctx.fillStyle = radial;
      ctx.fillRect(0, 0, 1200, 630);

      ctx.strokeStyle = 'rgba(148,255,224,0.18)';
      ctx.lineWidth = 2;
      ctx.strokeRect(30, 30, 1140, 570);

      ctx.fillStyle = '#68f4cd';
      ctx.font = '700 18px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillText('— APPLIED AI · COMPUTATIONAL BIOLOGY', 80, 120);

      ctx.fillStyle = '#e8fff9';
      ctx.font = '700 48px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillText('Sherifdeen Bilal Olamilekan', 80, 190);

      ctx.font = '500 24px system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif';
      ctx.fillStyle = '#91aaa8';
      ctx.fillText('Practical machine learning systems where data,', 80, 250);
      ctx.fillText('biology, and human decisions intersect.', 80, 285);

      let x = 80;
      x += drawPill('0.846 ROC-AUC', x, 360) + 16;
      x += drawPill('SHAP Explainability', x, 360) + 16;
      drawPill('FlyRank AI Intern', x, 360);

      ctx.fillStyle = '#607674';
      ctx.font = '16px ui-monospace, SFMono-Regular, Menlo, monospace';
      ctx.fillText('bilalsherifdeen1-ux.github.io', 80, 530);
    }

    function exportPng() {
      if (!ready) return;
      const link = document.createElement('a');
      link.download = 'og-preview.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      status.textContent = 'Ready — og-preview.png downloaded.';
    }

    const img = new Image();
    img.onload = () => {
      render();
      ctx.save();
      roundedRect(790, 100, 320, 420, 24);
      ctx.clip();
      ctx.drawImage(img, 790, 100, 320, 420);
      ctx.restore();
      ctx.strokeStyle = 'rgba(104,244,205,0.4)';
      ctx.lineWidth = 3;
      roundedRect(790, 100, 320, 420, 24);
      ctx.stroke();
      ready = true;
      status.textContent = 'Preview ready.';
      setTimeout(exportPng, 150);
    };
    img.onerror = () => { status.textContent = 'Could not load the embedded portrait.'; };
