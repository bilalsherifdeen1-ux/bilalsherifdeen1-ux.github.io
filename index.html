<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sherifdeen Bilal Olamilekan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --text: #0F172A;
    --bg: #FAFAFA;
    --accent: #2563EB;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .mark {
    font-weight: 700;
    font-size: 1.1rem;
    color: var(--accent);
    letter-spacing: 0.05em;
    margin-bottom: 24px;
  }
  h1 {
    font-weight: 700;
    font-size: clamp(1.5rem, 5vw, 2.25rem);
    max-width: 640px;
    line-height: 1.3;
    margin-bottom: 32px;
  }
  .links {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
  }
  .links a {
    font-weight: 700;
    font-size: 0.95rem;
    color: var(--accent);
    text-decoration: none;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    padding: 10px 18px;
  }
  .links a:hover {
    background: var(--accent);
    color: var(--bg);
  }
</style>
</head>
<body>
  <div>
    <div class="mark">SB</div>
    <h1>I build practical AI — SEO tools that save hours today, healthcare AI aimed at saving lives tomorrow.</h1>
    <div class="links">
      <a href="https://www.linkedin.com/in/bilal-sherifdeen-5872813a6" target="_blank">LinkedIn</a>
      <a href="https://github.com/bilalsherifdeen1-ux" target="_blank">GitHub</a>
      <a href="./cv.pdf" target="_blank">View CV</a>
      <a href="https://calendly.com/bilalsherifdeen1/30min" target="_blank">Book a Call</a>
    </div>
  </div>
</body>
</html>
